<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training plots: ACP, SSR, Hiking</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
html, body { margin: 0; }
.viz-root { background: var(--page); color: var(--text-primary); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border); padding: 8px 16px;
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
header a { color: var(--text-secondary); text-decoration: none; }
header a:hover { text-decoration: underline; }
header label { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
header .gen { color: var(--muted); margin-left: auto; }
main { padding: 4px 16px 40px; }
section { margin-top: 18px; }
section h2 { font-size: 16px; margin: 8px 0 2px; }
.meta { color: var(--text-secondary); margin-bottom: 6px; }
details { margin: 4px 0 10px; color: var(--text-secondary); }
details table { border-collapse: collapse; font-size: 12px; margin-top: 4px; }
details td, details th { padding: 2px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
details tr.failed td { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; }
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 8px 8px 4px; position: relative; }
.panel h3 { font-size: 12.5px; font-weight: 600; margin: 0 0 2px; }
.panel h3 .unit { color: var(--muted); font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--text-secondary); min-height: 0; margin-bottom: 2px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
.empty { color: var(--muted); font-size: 12px; padding: 60px 0; text-align: center; }
svg { display: block; width: 100%; height: 190px; user-select: none; }
svg text { fill: var(--muted); font-size: 10px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 11.5px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
  display: none; max-width: 360px; }
.tip .k { color: var(--text-secondary); }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.tip table { border-collapse: collapse; } .tip td { padding: 0 4px; } .tip td.v { text-align: right; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="viz-root">
<header>
  <h1>Training plots</h1>
  <span id="links"></span>
  <label>Smoothing <input id="smooth" type="range" min="0" max="0.99" step="0.01" value="0.8"><span id="smv">0.80</span></label>
  <label><input id="outl" type="checkbox" checked> ignore outliers in y-range</label>
  <label><input id="mk" type="checkbox" checked> restart markers</label>
  <label>Theme <select id="theme"><option value="">system</option><option value="light">light</option><option value="dark">dark</option></select></label>
  <span class="gen" id="gen"></span>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
</div>
<script>
const DATA = __DATA__;
const COLORS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const NS = 'http://www.w3.org/2000/svg';
const M = {l: 46, r: 8, t: 14, b: 20};
const H = 190;
const tip = document.getElementById('tip');
let SMOOTH = 0.8, OUTL = true, MK = true;
const zoom = {};

function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function h(tag, cls, text, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function col(i) { return `var(${COLORS[i % 8]})`; }
function fmt(v) {
  if (v == null || !isFinite(v)) return '-';
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e4) return (v / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'k';
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  if (a >= 1) return v.toFixed(2);
  if (a === 0) return '0';
  if (a >= 0.001) return v.toFixed(3);
  return v.toExponential(1);
}
function fmtIt(v) { return Math.round(v).toLocaleString('en-US'); }
function ticks(lo, hi, n) {
  const span = hi - lo; if (!(span > 0)) return [lo];
  const step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= step0);
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9 * span; v += step) out.push(+v.toPrecision(12));
  return out;
}
function ema(y, a) {
  // wandb-style debiased exponential moving average; nulls stay gaps
  const out = new Array(y.length); let last = 0, n = 0;
  for (let i = 0; i < y.length; i++) {
    if (y[i] == null) { out[i] = null; continue; }
    last = last * a + (1 - a) * y[i]; n++;
    out[i] = a > 0 ? last / (1 - Math.pow(a, n)) : y[i];
  }
  return out;
}
function quant(arr, q) { const s = arr.slice().sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.max(0, Math.floor(q * (s.length - 1))))]; }

function domainX(t) {
  if (zoom[t.id]) return zoom[t.id];
  let lo = t.x.length ? t.x[0] : 0, hi = t.x.length ? t.x[t.x.length - 1] : 1;
  for (const p of t.scorer) for (const s of p.series) for (const q of s.pts) { lo = Math.min(lo, q[0]); hi = Math.max(hi, q[0]); }
  if (hi <= lo) hi = lo + 1;
  return [lo, hi];
}

function drawPanel(t, p, box) {
  box.innerHTML = '';
  const W = Math.max(280, box.clientWidth);
  const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none'}, box);
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const [x0, x1] = domainX(t);
  const X = v => M.l + (v - x0) / (x1 - x0) * pw;
  // visible values for y-range
  let vals = [];
  const sm = [];
  if (p.kind === 'line') {
    p.series.forEach((s, i) => {
      sm[i] = ema(s.y, SMOOTH);
      for (let j = 0; j < t.x.length; j++) if (t.x[j] >= x0 && t.x[j] <= x1 && s.y[j] != null) vals.push(s.y[j]);
    });
  } else {
    for (const s of p.series) for (const q of s.pts) if (q[0] >= x0 && q[0] <= x1) vals.push(q[1]);
  }
  let y0, y1;
  if (p.ymin != null) { y0 = p.ymin; y1 = p.ymax; }
  else if (!vals.length) { y0 = 0; y1 = 1; }
  else {
    y0 = OUTL && vals.length > 50 ? quant(vals, 0.01) : Math.min(...vals);
    y1 = OUTL && vals.length > 50 ? quant(vals, 0.99) : Math.max(...vals);
    if (y1 - y0 < 1e-12) { const d = Math.abs(y0) * 0.05 || 0.5; y0 -= d; y1 += d; }
    const pad = (y1 - y0) * 0.06; y0 -= pad; y1 += pad;
  }
  const Y = v => M.t + (1 - (Math.min(Math.max(v, y0 - (y1 - y0)), y1 + (y1 - y0)) - y0) / (y1 - y0)) * ph;
  const clipId = 'c' + Math.random().toString(36).slice(2);
  const cp = el('clipPath', {id: clipId}, el('defs', {}, svg)); el('rect', {x: M.l, y: M.t, width: pw, height: ph}, cp);
  // grid + axes
  for (const v of ticks(y0, y1, 4)) {
    el('line', {x1: M.l, x2: M.l + pw, y1: Y(v), y2: Y(v), stroke: 'var(--grid)', 'stroke-width': 1}, svg);
    el('text', {x: M.l - 5, y: Y(v) + 3, 'text-anchor': 'end'}, svg).textContent = fmt(v);
  }
  for (const v of ticks(x0, x1, Math.max(2, Math.floor(pw / 80)))) {
    el('text', {x: X(v), y: H - 5, 'text-anchor': 'middle'}, svg).textContent = fmtIt(v);
  }
  el('line', {x1: M.l, x2: M.l + pw, y1: M.t + ph, y2: M.t + ph, stroke: 'var(--axis)', 'stroke-width': 1}, svg);
  // restart markers
  const mg = el('g', {}, svg);
  if (MK) {
    let lastLab = -1e9;
    for (const m of t.markers) {
      if (m.it < x0 || m.it > x1) continue;
      const x = X(m.it);
      el('line', {x1: x, x2: x, y1: M.t, y2: M.t + ph, stroke: 'var(--muted)', 'stroke-width': 1, 'stroke-opacity': m.kept ? 0.55 : 0.35,
                  'stroke-dasharray': m.kept ? '' : '2 3'}, mg);
      if (m.kept && x - lastLab > 16) { el('text', {x: x + 2, y: M.t - 3, 'font-size': 9}, mg).textContent = m.n; lastLab = x; }
    }
  }
  const g = el('g', {'clip-path': `url(#${clipId})`}, svg);
  if (p.kind === 'line') {
    const path = y => { let d = '', pen = false; for (let j = 0; j < t.x.length; j++) {
      if (y[j] == null || t.x[j] < x0 - (x1 - x0) * 0.02 || t.x[j] > x1 + (x1 - x0) * 0.02) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(t.x[j]).toFixed(1) + ',' + Y(y[j]).toFixed(1); pen = true; } return d; };
    p.series.forEach((s, i) => {
      if (SMOOTH > 0) el('path', {d: path(s.y), fill: 'none', stroke: col(i), 'stroke-width': 1, 'stroke-opacity': 0.22}, g);
      el('path', {d: path(sm[i]), fill: 'none', stroke: col(i), 'stroke-width': 2, 'stroke-linejoin': 'round'}, g);
    });
  } else {
    p.series.forEach((s, i) => {
      const pts = s.pts.slice().sort((a, b) => a[0] - b[0]);
      for (const q of pts) el('circle', {cx: X(q[0]), cy: Y(q[1]), r: 4, fill: col(i), stroke: 'var(--surface-1)', 'stroke-width': 2}, g);
    });
  }
  // interaction: crosshair + tooltip, drag to zoom, double-click to reset
  const cross = el('line', {y1: M.t, y2: M.t + ph, stroke: 'var(--text-secondary)', 'stroke-width': 1, visibility: 'hidden'}, svg);
  const sel = el('rect', {y: M.t, height: ph, fill: 'var(--muted)', 'fill-opacity': 0.15, visibility: 'hidden'}, svg);
  const hit = el('rect', {x: M.l, y: 0, width: pw, height: H, fill: 'transparent', style: 'cursor:crosshair'}, svg);
  const toX = ev => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * W / r.width; };
  const toY = ev => { const r = svg.getBoundingClientRect(); return (ev.clientY - r.top) * H / r.height; };
  let drag = null;
  hit.addEventListener('pointerdown', ev => { drag = toX(ev); hit.setPointerCapture(ev.pointerId); });
  hit.addEventListener('pointerup', ev => {
    const a = drag; drag = null; sel.setAttribute('visibility', 'hidden');
    if (a == null) return; const b = toX(ev);
    if (Math.abs(b - a) > 6) { const inv = px => x0 + (px - M.l) / pw * (x1 - x0); zoom[t.id] = [inv(Math.min(a, b)), inv(Math.max(a, b))]; drawTrack(t); }
  });
  hit.addEventListener('dblclick', () => { delete zoom[t.id]; drawTrack(t); });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
  hit.addEventListener('pointermove', ev => {
    const px = toX(ev), py = toY(ev), xv = x0 + (px - M.l) / pw * (x1 - x0);
    if (drag != null) { sel.setAttribute('x', Math.min(drag, px)); sel.setAttribute('width', Math.abs(px - drag)); sel.setAttribute('visibility', 'visible'); }
    let html = '';
    if (p.kind === 'line' && t.x.length) {
      let lo = 0, hi = t.x.length - 1; while (hi - lo > 1) { const md = (lo + hi) >> 1; if (t.x[md] < xv) lo = md; else hi = md; }
      const j = Math.abs(t.x[lo] - xv) < Math.abs(t.x[hi] - xv) ? lo : hi;
      cross.setAttribute('x1', X(t.x[j])); cross.setAttribute('x2', X(t.x[j])); cross.setAttribute('visibility', 'visible');
      const half = (t.bin - 1) / 2;
      html = `<div class="k">iteration ${half > 0 ? fmtIt(t.x[j] - half) + '-' + fmtIt(t.x[j] + half) : fmtIt(t.x[j])}</div><table>` +
        p.series.map((s, i) => `<tr><td><i style="background:${col(i)}"></i>${s.label}</td><td class="v">${fmt(sm[i][j])}</td><td class="v k">${SMOOTH > 0 ? 'raw ' + fmt(s.y[j]) : ''}</td></tr>`).join('') + '</table>';
    } else if (p.kind === 'points') {
      let best = null, bd = 14;
      p.series.forEach((s, i) => s.pts.forEach(q => { const d = Math.hypot(X(q[0]) - px, Y(q[1]) - py); if (d < bd) { bd = d; best = [i, s, q]; } }));
      if (best) html = `<div class="k">${best[2][2]} (iteration ${fmtIt(best[2][0])})</div><i style="background:${col(best[0])}"></i>${best[1].label}: ${fmt(best[2][1])} %`;
    }
    if (MK) {
      const near = t.markers.filter(m => m.it >= x0 && m.it <= x1 && Math.abs(X(m.it) - px) < 4);
      for (const m of near) html += `<div class="k" style="margin-top:4px">#${m.n} ${m.run} from ${fmtIt(m.it)} (${m.its}): ${m.ended}${m.change ? '<br>' + m.change : ''}</div>`;
    }
    if (html) { tip.innerHTML = html; tip.style.display = 'block';
      const tw = tip.offsetWidth; tip.style.left = Math.min(ev.clientX + 14, innerWidth - tw - 8) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; }
    else tip.style.display = 'none';
  });
}

function legend(p, wrap) {
  if (p.series.length < 2) return;
  const lg = h('div', 'legend', null, wrap);
  p.series.forEach((s, i) => { const sp = h('span', null, null, lg); const sw = h('i', p.kind === 'points' ? 'dot' : null, null, sp);
    sw.style.background = col(i); sp.appendChild(document.createTextNode(s.label)); if (s.note) sp.title = s.note; });
}

const boxes = {};
function drawTrack(t) { for (const [p, b] of boxes[t.id]) if (p.series.length) drawPanel(t, p, b); }

function build() {
  document.getElementById('gen').textContent = 'built ' + DATA.generated;
  const links = document.getElementById('links'), main = document.getElementById('main');
  links.innerHTML = DATA.tracks.map(t => `<a href="#${t.id}">${t.title}</a>`).join(' &middot; ');
  for (const t of DATA.tracks) {
    const sec = h('section', null, null, main); sec.id = t.id;
    h('h2', null, t.title, sec);
    h('div', 'meta', t.n ? `iterations ${fmtIt(t.first)} to ${fmtIt(t.last)} (${t.n.toLocaleString('en-US')} logged rows, points = mean of ${t.bin} iteration${t.bin > 1 ? 's' : ''})` +
      `${t.last_time ? ', last row ' + t.last_time : ''}; sources: ${t.folders.join(', ')}` : 'no data', sec);
    const det = h('details', null, null, sec);
    h('summary', null, `Run lineage: ${t.markers.length} ledger rows (numbers on the charts; solid = kept, dashed = tried and discarded). Drag on a chart to zoom, double-click to reset.`, det);
    const tb = h('table', null, null, det);
    tb.innerHTML = '<tr><th>#</th><th>from it.</th><th>run / version</th><th>iterations</th><th>ended how</th><th>what changed</th></tr>' +
      t.markers.map(m => `<tr class="${m.kept ? '' : 'failed'}"><td>${m.n}</td><td>${fmtIt(m.it)}</td><td>${m.run}</td><td>${m.its}</td><td>${m.ended}</td><td>${m.change}</td></tr>`).join('');
    const grid = h('div', 'grid', null, sec);
    boxes[t.id] = [];
    for (const p of t.panels.concat(t.scorer)) {
      const wrap = h('div', 'panel', null, grid);
      const ht = h('h3', null, p.title + ' ', wrap); if (p.unit) h('span', 'unit', p.unit, ht);
      legend(p, wrap);
      if (!p.series.length || (p.kind === 'points' && !p.series.some(s => s.pts.length))) { h('div', 'empty', p.empty || 'no data', wrap); continue; }
      const box = h('div', null, null, wrap);
      boxes[t.id].push([p, box]);
    }
  }
  DATA.tracks.forEach(drawTrack);
}
document.getElementById('smooth').addEventListener('input', e => { SMOOTH = +e.target.value; document.getElementById('smv').textContent = SMOOTH.toFixed(2); DATA.tracks.forEach(drawTrack); });
document.getElementById('outl').addEventListener('change', e => { OUTL = e.target.checked; DATA.tracks.forEach(drawTrack); });
document.getElementById('mk').addEventListener('change', e => { MK = e.target.checked; DATA.tracks.forEach(drawTrack); });
document.getElementById('theme').addEventListener('change', e => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => DATA.tracks.forEach(drawTrack), 150); });
build();
</script>
</body>
</html>
