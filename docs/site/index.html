order-radius:8px\" loading=\"lazy\"><\/iframe>\n    <\/div>\n\n    <div class=\"pa-sec\" id=\"runs-x2\">\n      <h3 class=\"pa-h3\">X2 runs<\/h3>\n      <div class=\"pa-grid3\">\n        <article class=\"pa-card pa-run\" id=\"run-acp\" data-run=\"acp\">\n          <div class=\"pa-run-head\"><h3 class=\"pa-h3\">ACP on the X2<\/h3><span class=\"pa-pill\" data-draw=\"pill\" data-source=\"tracks\" data-field=\"state\" data-kind-field=\"state_kind\" data-where=\"id=acp\">—<\/span><\/div>\n          <p class=\"pa-empty\" data-unless=\"run:acp\"><b>No training run yet.<\/b>Reward and terrain level per iteration will be charted here once the ACP track's first run reports.<\/p>\n          <div class=\"pa-stats\" data-when=\"run:acp\">\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Iteration<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"iteration\" data-where=\"run=acp\">—<\/span><span class=\"pa-stat-of\">of <span data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"total\" data-where=\"run=acp\">—<\/span><\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Reward<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num2\" data-source=\"run_latest\" data-field=\"reward\" data-where=\"run=acp\">—<\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Terrain level<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num2\" data-source=\"run_latest\" data-field=\"terrain_level\" data-where=\"run=acp\">—<\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Episode length (s, mean clip segment)<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num1\" data-source=\"run_latest\" data-field=\"episode_len\" data-where=\"run=acp\">—<\/span><\/div>\n          <\/div>\n          <div class=\"pa-grid2\" data-when=\"run:acp\">\n            <div><h4 class=\"pa-h4\">Mean episode reward by iteration<\/h4><div class=\"pa-chart\" id=\"chart-acp-reward\" data-draw=\"chart-series\" data-run=\"acp\" data-field=\"reward\" data-source=\"progress\"><\/div><\/div>\n            <div><h4 class=\"pa-h4\">Mean terrain level by iteration<\/h4><div class=\"pa-chart\" id=\"chart-acp-level\" data-draw=\"chart-series\" data-run=\"acp\" data-field=\"terrain_level\" data-source=\"progress\"><\/div><\/div>\n          <\/div>\n        <\/article>\n\n        <article class=\"pa-card pa-run\" id=\"run-ssr\" data-run=\"ssr\">\n          <div class=\"pa-run-head\"><h3 class=\"pa-h3\">SSR on the X2<\/h3><span class=\"pa-pill\" data-draw=\"pill\" data-source=\"tracks\" data-field=\"state\" data-kind-field=\"state_kind\" data-where=\"id=ssr\">—<\/span><\/div>\n          <p class=\"pa-empty\" data-unless=\"run:ssr\"><b>No training run yet.<\/b>Reward and terrain level per iteration will be charted here once the SSR track's first run reports.<\/p>\n          <div class=\"pa-stats\" data-when=\"run:ssr\">\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Iteration<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"iteration\" data-where=\"run=ssr\">—<\/span><span class=\"pa-stat-of\">of <span data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"total\" data-where=\"run=ssr\">—<\/span><\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Reward<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num1\" data-source=\"run_latest\" data-field=\"reward\" data-where=\"run=ssr\">—<\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Terrain level<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num2\" data-source=\"run_latest\" data-field=\"terrain_level\" data-where=\"run=ssr\">—<\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Episode length (s of 20)<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num1\" data-source=\"run_latest\" data-field=\"episode_len\" data-where=\"run=ssr\">—<\/span><\/div>\n          <\/div>\n          <div class=\"pa-grid2\" data-when=\"run:ssr\">\n            <div><h4 class=\"pa-h4\">Mean episode reward by iteration<\/h4><div class=\"pa-chart\" id=\"chart-ssr-reward\" data-draw=\"chart-series\" data-run=\"ssr\" data-field=\"reward\" data-source=\"progress\"><\/div><\/div>\n            <div><h4 class=\"pa-h4\">Mean terrain level by iteration<\/h4><div class=\"pa-chart\" id=\"chart-ssr-level\" data-draw=\"chart-series\" data-run=\"ssr\" data-field=\"terrain_level\" data-source=\"progress\"><\/div><\/div>\n          <\/div>\n        <\/article>\n\n        <article class=\"pa-card pa-run\" id=\"run-hiking\" data-run=\"hiking\">\n          <div class=\"pa-run-head\"><h3 class=\"pa-h3\">Hiking on the X2<\/h3><span class=\"pa-pill\" data-draw=\"pill\" data-source=\"tracks\" data-field=\"state\" data-kind-field=\"state_kind\" data-where=\"id=hiking\">—<\/span><\/div>\n          <p class=\"pa-empty\" data-unless=\"run:hiking\"><b>No training run yet.<\/b>Reward and terrain level per iteration will be charted here once the Hiking track's X2 port starts training.<\/p>\n          <div class=\"pa-stats\" data-when=\"run:hiking\">\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Iteration<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"iteration\" data-where=\"run=hiking\">—<\/span><span class=\"pa-stat-of\">of <span data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"total\" data-where=\"run=hiking\">—<\/span><\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Reward<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num1\" data-source=\"run_latest\" data-field=\"reward\" data-where=\"run=hiking\">—<\/span><\/div>\n            <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Terrain level<\/s =\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"iteration\" data-where=\"run=g1\">—<\/span><span class=\"pa-stat-of\">of <span data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"total\" data-where=\"run=g1\">—<\/span><\/span><\/div>\n          <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Reward<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num1\" data-source=\"run_latest\" data-field=\"reward\" data-where=\"run=g1\">—<\/span><\/div>\n          <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Terrain level<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"num2\" data-source=\"run_latest\" data-field=\"terrain_level\" data-where=\"run=g1\">—<\/span><\/div>\n          <div class=\"pa-stat\"><span class=\"pa-stat-lab\">Episode length (steps of 1,000)<\/span><span class=\"pa-stat-num\" data-draw=\"v\" data-fmt=\"int\" data-source=\"run_latest\" data-field=\"episode_len\" data-where=\"run=g1\">—<\/span><span class=\"pa-stat-of\">newest recorded<\/span><\/div>\n        <\/div>\n        <div class=\"pa-grid2\" data-when=\"run:g1\">\n          <div><h4 class=\"pa-h4\">Mean episode reward by iteration<\/h4><div class=\"pa-chart\" id=\"chart-g1-reward\" data-draw=\"chart-series\" data-run=\"g1\" data-field=\"reward\" data-source=\"progress\"><\/div><\/div>\n          <div><h4 class=\"pa-h4\">Mean terrain level by iteration<\/h4><div class=\"pa-chart\" id=\"chart-g1-level\" data-draw=\"chart-series\" data-run=\"g1\" data-field=\"terrain_level\" data-source=\"progress\"><\/div><\/div>\n        <\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <!-- ===================== INPUTS ===================== -->\n  <section class=\"pa-view\" id=\"inputs\" data-view=\"inputs\" hidden>\n    <div class=\"pa-sec\">\n      <h2 class=\"pa-h2\">What goes into each training<\/h2>\n      <p class=\"pa-p pa-muted\">Every reward, terrain, command and data choice, sorted by where it comes from: the method's own paper on the left, anything added on the right.<\/p>\n      <div class=\"pa-legend\"><span><i class=\"pa-sw k-paper\"><\/i>True to paper<\/span><span><i class=\"pa-sw k-papers\"><\/i>Added, from other papers<\/span><span><i class=\"pa-sw k-ours\"><\/i>Added, ours<\/span><\/div>\n    <\/div>\n\n    <div class=\"pa-sec pa-card\" id=\"inputs-hiking\" data-run=\"hiking\">\n      <div class=\"pa-sec-head\"><h3 class=\"pa-track-name\">Hiking<\/h3><span class=\"pa-muted pa-small\"><span data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"total\" data-where=\"track=Hiking\">—<\/span> items<\/span><\/div>\n      <div class=\"pa-split\" data-draw=\"split\" data-track=\"Hiking\" data-source=\"detail_split\" role=\"img\" aria-label=\"Share of Hiking items that are true to the paper or added\"><\/div>\n      <div class=\"pa-cols\">\n        <div class=\"pa-col\"><div class=\"pa-col-head k-paper\">True to paper<span class=\"pa-col-n\" data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"paper\" data-where=\"track=Hiking\">—<\/span><\/div>\n          <ul class=\"pa-list\" data-draw=\"detail-list\" data-track=\"Hiking\" data-kind=\"paper\" data-source=\"details\"><\/ul>\n          <p class=\"pa-empty\" data-unless=\"detail:Hiking:paper\">Nothing listed yet.<\/p><\/div>\n        <div class=\"pa-col\"><div class=\"pa-col-head k-ours\">Added<span class=\"pa-col-n\" data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"added\" data-where=\"track=Hiking\">—<\/span><\/div>\n          <ul class=\"pa-list\" data-draw=\"detail-list\" data-track=\"Hiking\" data-kind=\"added\" data-source=\"details\"><\/ul>\n          <p class=\"pa-empty\" data-unless=\"detail:Hiking:added\">Nothing added so far.<\/p><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"pa-sec pa-card\" id=\"inputs-acp\" data-run=\"acp\">\n      <div class=\"pa-sec-head\"><h3 class=\"pa-track-name\">ACP<\/h3><span class=\"pa-muted pa-small\"><span data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"total\" data-where=\"track=ACP\">—<\/span> items<\/span><\/div>\n      <div class=\"pa-split\" data-draw=\"split\" data-track=\"ACP\" data-source=\"detail_split\" role=\"img\" aria-label=\"Share of ACP items that are true to the paper or added\"><\/div>\n      <div class=\"pa-cols\">\n        <div class=\"pa-col\"><div class=\"pa-col-head k-paper\">True to paper<span class=\"pa-col-n\" data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"paper\" data-where=\"track=ACP\">—<\/span><\/div>\n          <ul class=\"pa-list\" data-draw=\"detail-list\" data-track=\"ACP\" data-kind=\"paper\" data-source=\"details\"><\/ul>\n          <p class=\"pa-empty\" data-unless=\"detail:ACP:paper\">Nothing listed yet.<\/p><\/div>\n        <div class=\"pa-col\"><div class=\"pa-col-head k-ours\">Added<span class=\"pa-col-n\" data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"added\" data-where=\"track=ACP\">—<\/span><\/div>\n          <ul class=\"pa-list\" data-draw=\"detail-list\" data-track=\"ACP\" data-kind=\"added\" data-source=\"details\"><\/ul>\n          <p class=\"pa-empty\" data-unless=\"detail:ACP:added\">Nothing added so far. Deviations from the paper will be listed here as the track reports them.<\/p><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"pa-sec pa-card\" id=\"inputs-ssr\" data-run=\"ssr\">\n      <div class=\"pa-sec-head\"><h3 class=\"pa-track-name\">SSR<\/h3><span class=\"pa-muted pa-small\"><span data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"total\" data-where=\"track=SSR\">—<\/span> items<\/span><\/div>\n      <div class=\"pa-split\" data-draw=\"split\" data-track=\"SSR\" data-source=\"detail_split\" role=\"img\" aria-label=\"Share of SSR items that are true to the paper or added\"><\/div>\n      <div class=\"pa-cols\">\n        <div class=\"pa-col\"><div class=\"pa-col-head k-paper\">True to paper<span class=\"pa-col-n\" data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"paper\" data-where=\"track=SSR\">—<\/span><\/div>\n          <ul class=\"pa-list\" data-draw=\"detail-list\" data-track=\"SSR\" data-kind=\"paper\" data-source=\"details\"><\/ul>\n          <p class=\"pa-empty\" data-unless=\"detail:SSR:paper\">Nothing listed yet.<\/p><\/div>\n        <div class=\"pa-col\"><div class=\"pa-col-head k-ours\">Added<span class=\"pa-col-n\" data-draw=\"v\" data-fmt=\"int\" data-source=\"detail_split\" data-field=\"added\" data-where=\"track=SSR\">—<\/span><\/div>\n          <ul class=\"pa-list\" data-draw=\"detail-list\" data-track=\"SSR\" data-kind=\"added\" data-source=\"details\"><\/ul>\n          <p class=\"pa-empty\" data-unless=\"detail:SSR:added\">Nothing added so far. Deviations from the paper will be listed here as the track reports them.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===================== PAPER VS CODE ===================== -->\n  <section class=\"pa-view\" id=\"paper\" data-view=\"paper\" hidden>\n    <div class=\"pa-sec\">\n      <h2 class=\"pa-h2\">Where our code differs from the paper, and what we decided<\/h2>\n      <p class=\"pa-p pa-muted\">Two independent audits of the live code against each method's paper (2026-11-13). Listed here: every item the paper specifies and we did not follow, with the user's decision of 2026-11-13 and where it stands. Items that match, deviations the paper does not settle, and additions are in the audit files.<\/p>\n      <p class=\"pa-p pa-small\">SSR (<code>docs/findings/ssr_paper_vs_code.md<\/code>): 108 match, 51 deviations justified, 26 not followed, 37 added.<br>ACP (<code>docs/findings/acp_paper_vs_code.md<\/code>): 75 match, 33 deviations justified, 25 not followed, 18 added.<\/p>\n      <div class=\"pa-legend\"><span><i class=\"pa-sw k-done\"><\/i>Done<\/span><span><i class=\"pa-sw k-pending\"><\/i>Pending (at the named restart)<\/span><span><i class=\"pa-sw k-kept\"><\/i>Kept ours, by decision<\/span><\/div>\n    <\/div>\n    <div class=\"pa-sec pa-card\" id=\"paper-ssr\">\n      <div class=\"pa-sec-head\"><h3 class=\"pa-track-name\">SSR<\/h3><span class=\"pa-muted pa-small\"><span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"total\" data-where=\"track=SSR\">—<\/span> items not followed: <span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"done\" data-where=\"track=SSR\">—<\/span> done, <span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"pending\" data-where=\"track=SSR\">—<\/span> pending, <span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"kept\" data-where=\"track=SSR\">—<\/span> kept<\/span><\/div>\n      <p class=\"pa-p pa-muted pa-small\">Decision: follow the paper on every item, carried into v16 (run r9, started 04:02 UTC) through a 500-iteration transition, except where a user rule keeps ours.<\/p>\n      <div class=\"pa-scroll\">\n        <table class=\"pa-table pa-diff\" id=\"table-paper-ssr\" data-source=\"paper_diffs\" data-row-key=\"id\">\n          <thead><tr><th data-field=\"item\">Item<\/th><th data-field=\"paper\">Paper<\/th><th data-field=\"ours\">Ours<\/th><th data-field=\"decision\">Decision<\/th><th data-field=\"status\">Status<\/th><\/tr><\/thead>\n          <tbody data-draw=\"diff-table\" data-track=\"SSR\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n    <div class=\"pa-sec pa-card\" id=\"paper-acp\">\n      <div class=\"pa-sec-head\"><h3 class=\"pa-track-name\">ACP<\/h3><span class=\"pa-muted pa-small\"><span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"total\" data-where=\"track=ACP\">—<\/span> items not followed: <span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"done\" data-where=\"track=ACP\">—<\/span> done, <span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"pending\" data-where=\"track=ACP\">—<\/span> pending, <span data-draw=\"v\" data-fmt=\"int\" data-source=\"paper_diff_counts\" data-field=\"kept\" data-where=\"track=ACP\">—<\/span> kept<\/span><\/div>\n      <p class=\"pa-p pa-muted pa-small\">Decision: stage-2 items at the 06:00 UTC restart, stage-3 items at the stage-3 switch; ACP's own goal families, larger env counts and the user's data choices stay.<\/p>\n      <div class=\"pa-scroll\">\n        <table class=\"pa-table pa-diff\" id=\"table-paper-acp\" data-source=\"paper_diffs\" data-row-key=\"id\">\n          <thead><tr><th data-field=\"item\">Item<\/th><th data-field=\"paper\">Paper<\/th><th data-field=\"ours\">Ours<\/th><th data-field=\"decision\">Decision<\/th><th data-field=\"status\">Status<\/th><\/tr><\/thead>\n          <tbody data-draw=\"diff-table\" data-track=\"ACP\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===================== ROBOT ===================== -->\n  <section class=\"pa-view\" id=\"robot\" data-view=\"robot\" hidden>\n    <div class=\"pa-sec\">\n      <h2 class=\"pa-h2\">Robot, retargeted motions and props<\/h2>\n      <p class=\"pa-p pa-muted\">What exists for the X2 and what state it is in. Dataset clip names are never shown. Motion data: Bones Studio.<\/p>\n    <\/div>\n    <div class=\"pa-grid2\">\n      <div class=\"pa-sec\" id=\"robot-motion\"><h3 class=\"pa-h3\">Retargeted motion<\/h3><ul class=\"pa-list\" data-draw=\"robot-list\" data-area=\"Retargeted motion\" data-source=\"robot\"><\/ul><\/div>\n      <div class=\"pa-sec\">\n        <div class=\"pa-sec\" id=\"robot-props\"><h3 class=\"pa-h3\">Props<\/h3><ul class=\"pa-list\" data-draw=\"robot-list\" data-area=\"Props\" data-source=\"robot\"><\/ul><\/div>\n        <div class=\"pa-sec\" id=\"robot-robot\"><h3 class=\"pa-h3\">Robot<\/h3><ul class=\"pa-list\" data-draw=\"robot-list\" data-area=\"Robot\" data-source=\"robot\"><\/ul><\/div>\n        <div class=\"pa-sec\" id=\"robot-camera\"><h3 class=\"pa-h3\">Camera<\/h3><ul class=\"pa-list\" data-draw=\"robot-list\" data-area=\"Camera\" data-source=\"robot\"><\/ul><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"pa-sec\" id=\"robot-review\">\n      <h3 class=\"pa-h3\">Retargeted motion to review<\/h3>\n      <div class=\"pa-gallery\" data-when=\"renders:motion\" data-draw=\"gallery\" data-group=\"motion\" data-source=\"renders\"><\/div>\n      <p class=\"pa-empty\" data-unless=\"renders:motion\"><b>No X2 motion renders yet.<\/b>Frames of the retargeted X2 motions and the fitted props will appear here for review once a track renders them. Motion data: Bones Studio.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ===================== EVAL ===================== -->\n  <section class=\"pa-view\" id=\"eval\" data-view=\"eval\" hidden>\n    <div class=\"pa-sec\" id=\"eval-apparatus\">\n      <h2 class=\"pa-h2\">Apparatus success against the goal<\/h2>\n      <p class=\"pa-p pa-muted\">Share of trials in which the X2 walks the whole route without a fall, per track and apparatus, from the newest full-route run of each. This is the number the work is judged by. Rows without a success figure are station-leg runs (five legs of 50 trials; the full route runs only when every leg reaches 45 of 50); their leg scores are in the note.<\/p>\n      <div class=\"pa-card\">\n        <div class=\"pa-chart\" id=\"chart-app\" data-draw=\"chart-app\" data-source=\"scores targets\"><\/div>\n      <\/div>\n      <p class=\"pa-empty\" data-unless=\"app:any\"><b>No track has been scored on an apparatus yet.<\/b>Each eval run will add a bar above and a row here: track, checkpoint, apparatus, simulator, trials, success, and success per section of the route.<\/p>\n      <div class=\"pa-scroll\" data-when=\"app:any\">\n        <table class=\"pa-table\" id=\"table-app\" data-source=\"apparatus_results\" data-row-key=\"id\">\n          <thead><tr><th data-field=\"date\">Date<\/th><th data-field=\"track\">Track<\/th><th data-field=\"checkpoint\">Checkpoint<\/th><th data-field=\"apparatus\">Apparatus<\/th><th data-field=\"simulator\">Simulator<\/th><th class=\"pa-num\" data-field=\"trials\">Trials<\/th><th class=\"pa-num\" data-field=\"success_pct\">Success<\/th><th class=\"pa-num\" data-field=\"door_pct\">Door<\/th><th class=\"pa-num\" data-field=\"stepovers_pct\">4x4s<\/th><th class=\"pa-num\" data-field=\"ramps_pct\">Ramps<\/th><th class=\"pa-num\" data-field=\"stairs_pct\">Stairs<\/th><th data-field=\"note\">Note<\/th><\/tr><\/thead>\n          <tbody data-draw=\"app-table\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n\n    <div class=\"pa-sec\" id=\"eval-rules\">\n      <h3 class=\"pa-h3\">How a trial is scored<\/h3>\n      <dl class=\"pa-rules\" data-draw=\"rules\" data-source=\"eval_rules\"><\/dl>\n    <\/div>\n\n    <div class=\"pa-sec\" id=\"eval-g1\">\n      <h2 class=\"pa-h2\">Earlier result: the G1 reproduction against the paper<\/h2>\n      <p class=\"pa-p pa-muted\">Hiking in the Wild on the Unitree G1 in the training simulator, per terrain, next to the figure the paper reports. Not the X2 and not the apparatus. Sorted by how far the reproduction falls short.<\/p>\n      <div class=\"pa-card pa-sec\" data-run=\"g1\">\n        <div class=\"pa-legend\">\n          <span><i class=\"pa-sw\" style=\"--k: var(--color-ok)\"><\/i>Within 1 point of the paper<\/span>\n          <span><i class=\"pa-sw\" style=\"--k: var(--color-warn)\"><\/i>1 to 5 points below<\/span>\n          <span><i class=\"pa-sw\" style=\"--k: var(--color-bad)\"><\/i>More than 5 points below<\/span>\n          <span><i class=\"pa-sw pa-sw-tick\"><\/i>Paper<\/span>\n          <span>Labels: reproduction / paper<\/span>\n        <\/div>\n        <div class=\"pa-chart\" id=\"chart-g1\" data-draw=\"chart-g1\" data-source=\"g1_results g1_gaps\"><\/div>\n      <\/div>\n      <div class=\"pa-scroll\">\n        <table class=\"pa-table\" id=\"table-g1\" data-source=\"g1_results\" data-row-key=\"id\">\n          <thead><tr><th data-field=\"terrain\">Terrain<\/th><th data-field=\"checkpoint\">Checkpoint<\/th><th class=\"pa-num\" data-field=\"success_pct\">Success<\/th><th class=\"pa-num\" data-field=\"paper_success_pct\">Paper<\/th><th class=\"pa-num\" data-source=\"g1_gaps\" data-field=\"gap_pts\">Gap, points<\/th><th class=\"pa-num\" data-field=\"time_s\">Time to target, s<\/th><th class=\"pa-num\" data-field=\"paper_time_s\">Paper, s<\/th><th class=\"pa-num\" data-field=\"robots\">Robots<\/th><\/tr><\/thead>\n          <tbody data-draw=\"g1-table\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===================== RENDERS ===================== -->\n  <section class=\"pa-view\" id=\"renders\" data-view=\"renders\" hidden>\n    <div class=\"pa-sec\">\n      <h2 class=\"pa-h2\">Renders<\/h2>\n      <p class=\"pa-p pa-muted\">Click a picture to enlarge it. Each picture says where it comes from.<\/p>\n    <\/div>\n    <div class=\"pa-sec\" id=\"renders-map\">\n      <h3 class=\"pa-h3\">Training map and commanded routes<\/h3>\n      <p class=\"pa-p pa-muted pa-small\">Previews drawn from the terrain generator scripts, not from a simulator. Red lines are the commanded routes. The small figure is a size stand-in, not a robot model.<\/p>\n      <div class=\"pa-gallery\" data-draw=\"gallery\" data-group=\"map\" data-source=\"renders\"><\/div>\n    <\/div>\n    <div class=\"pa-sec\" id=\"renders-robot\">\n      <h3 class=\"pa-h3\">Robot in simulation<\/h3>\n      <p class=\"pa-p pa-muted pa-small\">So far only the Unitree G1 from the earlier reproduction, in MuJoCo, which is not the training simulator. X2 walks on the apparatus will be added per checkpoint: a chase view and a legs close-up of the best, the median and a failed trial. Motion data: Bones Studio.<\/p>\n      <div class=\"pa-gallery\" data-draw=\"gallery\" data-group=\"robot\" data-source=\"renders\"><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===================== OPEN ITEMS + LOG ===================== -->\n  <section class=\"pa-view\" id=\"open\" data-view=\"open\" hidden>\n    <div class=\"pa-sec\" id=\"open-you\">\n      <h2 class=\"pa-h2\">Waiting on you<\/h2>\n      <ul class=\"pa-list pa-grid3\" data-draw=\"open-list\" data-who=\"you\" data-source=\"open_items\"><\/ul>\n      <p class=\"pa-empty\" data-unless=\"you:any\"><b>Nothing is waiting on you.<\/b>Decisions the team needs from you will show up here.<\/p>\n    <\/div>\n    <div class=\"pa-sec\" id=\"open-team\">\n      <h2 class=\"pa-h2\">With the team<\/h2>\n      <ul class=\"pa-list pa-grid2\" data-draw=\"open-list\" data-who=\"agent\" data-source=\"open_items\"><\/ul>\n    <\/div>\n    <div class=\"pa-sec\" id=\"worklog\">\n      <h2 class=\"pa-h2\">Work log<\/h2>\n      <p class=\"pa-p pa-muted pa-small\">Newest first, with where the files are.<\/p>\n      <ul class=\"pa-log\" data-draw=\"worklog\" data-source=\"worklog\"><\/ul>\n    <\/div>\n  <\/section>\n<\/div>\n\n<div class=\"pa-lb\" id=\"lightbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Enlarged render\" hidden>\n  <div class=\"pa-lb-bar\">\n    <button class=\"pa-btn\" type=\"button\" data-lb=\"prev\">Previous<\/button>\n    <button class=\"pa-btn\" type=\"button\" data-lb=\"next\">Next<\/button>\n    <span class=\"pa-lb-hint\">Click the picture for full size<\/span>\n    <button class=\"pa-btn\" type=\"button\" data-lb=\"close\">Close<\/button>\n  <\/div>\n  <div class=\"pa-lb-body\" data-draw=\"lightbox\" data-source=\"renders\"><\/div>\n<\/div>\n<\/div>\n\n<script>\n  /* ---------- values worked out from the datasets ---------- */\n  dash.calc('scores', {\n    title: 'Newest apparatus score per track',\n    description: 'For each training track, the newest full-route eval run on our apparatus and on the NIST apparatus (station-leg runs have no full-route figure and are skipped).',\n    inputs: ['tracks', 'apparatus_results'],\n    fn: (tracks, results) => tracks.filter((t) => t.kind === 'track').map((t) => {\n      const newest = (apparatus) => results.filter((r) => r.track === t.track && r.apparatus === apparatus && r.success_pct !== null && r.success_pct !== undefined && r.success_pct !== '')\n        .sort((a, b) => String(a.date).localeCompare(String(b.date))).pop() || {};\n      const num = (v) => (v === null || v === undefined || v === '' ? null : +v);\n      const ours = newest('ours'), nist = newest('nist');\n      return {\n        id: t.id, track: t.track,\n        ours_pct: num(ours.success_pct), ours_trials: num(ours.trials), ours_checkpoint: ours.checkpoint || '', ours_simulator: ours.simulator || '', ours_date: ours.date || '',\n        nist_pct: num(nist.success_pct), nist_trials: num(nist.trials), nist_checkpoint: nist.checkpoint || '', nist_simulator: nist.simulator || '', nist_date: nist.date || '',\n      };\n    }),\n  });\n  dash.calc('run_latest', {\n    title: 'Newest recorded point per training run',\n    description: 'The point with the highest iteration for each run, and how many points are recorded.',\n    inputs: ['progress'],\n    fn: (progress) => ['acp', 'ssr', 'hiking', 'g1'].map((run) => {\n      const points = progress.filter((p) => p.run === run).sort((a, b) => a.iteration - b.iteration);\n      const last = points[points.length - 1] || {};\n      const lastWith = (field) => { const p = points.filter((x) => x[field] !== null && x[field] !== undefined && x[field] !== '').pop(); return p ? +p[field] : null; };\n      return { run, points: points.length, iteration: last.iteration ?? null, total: last.total ?? null, reward: lastWith('reward'), terrain_level: lastWith('terrain_level'), episode_len: lastWith('episode_len') };\n    }),\n  });\n  dash.calc('detail_split', {\n    title: 'True to paper or added, per track',\n    description: 'Count of listed training details per track by where they come from.',\n    inputs: ['details'],\n    fn: (details) => ['Hiking', 'ACP', 'SSR'].map((track) => {\n      const mine = details.filter((d) => d.track === track);\n      const count = (kind) => mine.filter((d) => d.origin_kind === kind).length;\n      return { track, paper: count('paper'), papers: count('papers'), ours: count('ours'), added: count('papers') + count('ours'), total: mine.length };\n    }),\n  });\n  dash.calc('g1_gaps', {\n    title: 'G1 reproduction: gap to the paper',\n    description: \"The paper's success minus the reproduction's, in percentage points, per terrain.\",\n    inputs: ['g1_results'],\n    fn: (g1_results) => g1_results.map((r) => ({ id: r.id, terrain: r.terrain, gap_pts: Math.round((r.paper_success_pct - r.success_pct) * 100) / 100 })),\n  });\n  dash.calc('summary', {\n    title: 'Where the work stands',\n    description: 'Counts of agents by state, X2 runs that have reported, tracks with an apparatus score, and items waiting on you.',\n    inputs: ['tracks', 'progress', 'apparatus_results', 'open_items'],\n    fn: (tracks, progress, results, open_items) => {\n      const trackNames = tracks.filter((t) => t.kind === 'track').map((t) => t.track);\n      return [{\n        id: 'now',\n        agents: tracks.length,\n        tracks: trackNames.length,\n        setting_up: tracks.filter((t) => t.state_kind === 'setup').length,\n        training: tracks.filter((t) => t.state_kind === 'training').length,\n        x2_runs: new Set(progress.filter((p) => p.robot === 'X2').map((p) => p.run)).size,\n        scored_tracks: new Set(results.filter((r) => trackNames.includes(r.track)).map((r) => r.track)).size,\n        eval_runs: results.length,\n        waiting_on_you: open_items.filter((o) => o.who_kind === 'you').length,\n        updated_at: tracks.map((t) => t.updated_at || '').sort().pop() || '',\n      }];\n    },\n  });\n\n  /* ---------- helpers ---------- */\n  const paRoot = document.querySelector('.pa');\n  const paAll = (sel) => (paRoot ? Array.from(paRoot.querySelectorAll(sel)) : []);\n  const paRows = (id) => { const d = dash.data(id); return d.status === 'ok' && Array.isArray(d.data) ? d.data : []; };\n  const paOk = (id) => dash.data(id).status === 'ok';\n  const paBlank = (v) => v === null || v === undefined || v === '';\n  const paFmt = {\n    text: (v) => (paBlank(v) ? '—' : String(v)),\n    int: (v) => (paBlank(v) ? '—' : d3.format(',')(Math.round(+v))),\n    num1: (v) => (paBlank(v) ? '—' : d3.format(',.1f')(+v)),\n    num2: (v) => (paBlank(v) ? '—' : d3.format(',.2f')(+v)),\n    pct: (v) => (paBlank(v) ? '—' : d3.format('.1f')(+v) + '%'),\n    pct0: (v) => (paBlank(v) ? '—' : d3.format('.0f')(+v) + '%'),\n    date: (v) => { if (paBlank(v)) return '—'; const d = new Date(v); return isNaN(d) ? String(v) : d3.utcFormat('%b %-d')(d); },\n    datetime: (v) => { if (paBlank(v)) return '—'; const d = new Date(v); return isNaN(d) ? String(v) : d3.utcFormat('%b %-d, %H:%M UTC')(d); },\n  };\n  const paEl = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };\n  const paMark = (e, source, field, key, value) => { e.dataset.source = source; e.dataset.field = field; e.dataset.where = encodeURIComponent(key) + '=' + encodeURIComponent(value); return e; };\n  const paFind = (el) => {\n    const d = dash.data(el.dataset.source);\n    if (d.status !== 'ok' || !Array.isArray(d.data)) return null;\n    const w = el.dataset.where;\n    if (!w) return d.data[0] || null;\n    const i = w.indexOf('='), k = decodeURIComponent(w.slice(0, i)), v = decodeURIComponent(w.slice(i + 1));\n    return d.data.find((r) => String(r[k]) === v) || null;\n  };\n  const paTip = (host) => {\n    const t = paEl('div', 'pa-tip'); t.hidden = true; host.appendChild(t);\n    return {\n      show(head, pairs, note, x, y) {\n        t.replaceChildren(paEl('div', 'pa-tip-h', head));\n        pairs.forEach(([k, v]) => { const r = paEl('div', 'pa-tip-r'); r.append(paEl('span', null, k), paEl('span', null, v)); t.appendChild(r); });\n        if (note) t.appendChild(paEl('div', 'pa-tip-n', note));\n        t.hidden = false;\n        const w = host.clientWidth, tw = t.offsetWidth, th = t.offsetHeight;\n        t.style.left = Math.max(0, Math.min(w - tw, x + 14)) + 'px';\n        t.style.top = Math.max(0, y - th - 10) + 'px';\n      },\n      hide() { t.hidden = true; },\n    };\n  };\n  const paSvg = (el, w, h, label) => {\n    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', '100%').attr('role', 'img').attr('aria-label', label);\n    return svg;\n  };\n  const paTextW = (svg, strings, cls) => {\n    const t = svg.append('text').attr('class', cls || null); let m = 0;\n    strings.forEach((s) => { t.text(s); m = Math.max(m, t.node().getComputedTextLength()); });\n    t.remove(); return Math.ceil(m);\n  };\n  const paLocal = (el, event) => { const r = el.getBoundingClientRect(); return [event.clientX - r.left, event.clientY - r.top]; };\n\n  /* ---------- single values, pills, meters ---------- */\n  dash.draw('v', (el) => {\n    const row = paFind(el);\n    el.textContent = (paFmt[el.dataset.fmt] || paFmt.text)(row ? row[el.dataset.field] : null);\n    if (el.dataset.flagField) el.classList.toggle('is-flag', !!(row && row[el.dataset.flagField]));\n  });\n  dash.draw('pill', (el) => {\n    const row = paFind(el);\n    el.textContent = paFmt.text(row ? row[el.dataset.field] : null);\n    el.className = 'pa-pill k-' + String((row && row[el.dataset.kindField]) || 'none').replace(/[^a-z]/g, '');\n  });\n  dash.draw('meter', (el) => {\n    const row = paFind(el), v = row ? row[el.dataset.field] : null;\n    const goal = paRows('targets').find((t) => t.id === 'goal');\n    el.replaceChildren();\n    if (!paBlank(v)) { const f = paEl('div', 'pa-meter-fill'); f.style.width = Math.max(0, Math.min(100, +v)) + '%'; el.appendChild(f); }\n    if (goal) { const g = paEl('div', 'pa-meter-goal'); g.style.left = 'calc(' + Math.max(0, Math.min(100, +goal.value_pct)) + '% - 1px)'; el.appendChild(g); }\n  });\n\n  /* ---------- lists ---------- */\n  dash.draw('open-list', (el) => {\n    const who = el.dataset.who;\n    const items = paRows('open_items').filter((o) => (who === 'you' ? o.who_kind === 'you' : o.who_kind !== 'you'));\n    el.replaceChildren(...items.map((o) => {\n      const li = paEl('li', 'pa-item' + (o.who_kind === 'you' ? ' is-you' : ''));\n      const top = paEl('div', 'pa-item-top');\n      top.append(paMark(paEl('span', 'pa-chip', o.who), 'open_items', 'who', 'id', o.id), paMark(paEl('span', 'pa-pill k-' + o.status_kind, o.status), 'open_items', 'status', 'id', o.id));\n      li.append(top, paMark(paEl('p', 'pa-item-txt', o.item), 'open_items', 'item', 'id', o.id));\n      return li;\n    }));\n  });\n  dash.draw('worklog', (el) => {\n    let items = paRows('worklog');\n    if (el.dataset.limit) items = items.slice(0, +el.dataset.limit);\n    el.replaceChildren(...items.map((w) => {\n      const li = paEl('li');\n      li.append(\n        paMark(paEl('span', 'pa-log-date', paFmt.date(w.date)), 'worklog', 'date', 'id', w.id),\n        paMark(paEl('span', 'pa-chip', w.area), 'worklog', 'area', 'id', w.id),\n        paMark(paEl('p', 'pa-log-what', w.what), 'worklog', 'what', 'id', w.id),\n        paMark(paEl('span', 'pa-log-where pa-mono', w.where), 'worklog', 'where', 'id', w.id));\n      return li;\n    }));\n  });\n  dash.draw('detail-list', (el) => {\n    const added = el.dataset.kind === 'added';\n    const items = paRows('details').filter((d) => d.track === el.dataset.track && (added ? d.origin_kind !== 'paper' : d.origin_kind === 'paper'));\n    el.replaceChildren(...items.map((d) => {\n      const li = paEl('li', 'pa-item');\n      const top = paEl('div', 'pa-item-top');\n      top.append(paMark(paEl('span', 'pa-chip', d.area), 'details', 'area', 'id', d.id));\n      if (added) top.append(paMark(paEl('span', 'pa-chip k-' + d.origin_kind, d.origin), 'details', 'origin', 'id', d.id));\n      top.append(paMark(paEl('span', 'pa-pill k-' + d.status_kind, d.status), 'details', 'status', 'id', d.id));\n      li.append(top, paMark(paEl('p', 'pa-item-txt', d.item), 'details', 'item', 'id', d.id));\n      if (d.decided) li.append(paMark(paEl('p', 'pa-item-sub', d.decided), 'details', 'decided', 'id', d.id));\n      return li;\n    }));\n  });\n  dash.draw('split', (el) => {\n    const row = paRows('detail_split').find((r) => r.track === el.dataset.track);\n    el.replaceChildren();\n    if (!row) return;\n    [['paper', 'k-paper'], ['papers', 'k-papers'], ['ours', 'k-ours']].forEach(([k, cls]) => {\n      if (!row[k]) return;\n      const seg = paEl('i', cls); seg.style.flex = row[k] + ' 1 0'; el.appendChild(seg);\n    });\n  });\n  dash.draw('robot-list', (el) => {\n    const items = paRows('robot').filter((r) => r.area === el.dataset.area);\n    el.replaceChildren(...items.map((r) => {\n      const li = paEl('li', 'pa-item');\n      const top = paEl('div', 'pa-item-top');\n      if (r.amount) top.append(paMark(paEl('span', 'pa-item-amt', r.amount), 'robot', 'amount', 'id', r.id));\n      top.append(paMark(paEl('span', 'pa-pill k-' + r.status_kind, r.status), 'robot', 'status', 'id', r.id));\n      li.append(top, paMark(paEl('p', 'pa-item-txt', r.item), 'robot', 'item', 'id', r.id));\n      return li;\n    }));\n  });\n  dash.draw('rules', (el) => {\n    const out = [];\n    paRows('eval_rules').forEach((r) => {\n      out.push(paMark(paEl('dt', null, r.rule), 'eval_rules', 'rule', 'id', r.id), paMark(paEl('dd', 'pa-rule-txt', r.text), 'eval_rules', 'text', 'id', r.id));\n      const dd = paEl('dd', 'pa-rule-st'); dd.appendChild(paMark(paEl('span', 'pa-pill k-' + r.status_kind, r.status), 'eval_rules', 'status', 'id', r.id)); out.push(dd);\n    });\n    el.replaceChildren(...out);\n  });\n\n  /* ---------- tables ---------- */\n  const paRowsInto = (el, rows, cols) => {\n    el.replaceChildren(...rows.map((r) => {\n      const tr = paEl('tr'); tr.dataset.key = encodeURIComponent(r.id);\n      cols.forEach((c) => { const td = paEl
